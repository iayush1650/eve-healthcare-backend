version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: eve_postgres
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eve_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://eve_user:eve_password@db:5432/eve_healthcare
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-dev-secret-key
      WEBHOOK_SECRET: docker-webhook-secret
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ───────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_celery_worker
    environment:
      DATABASE_URL: postgresql://eve_user:eve_password@db:5432/eve_healthcare
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-dev-secret-key
      WEBHOOK_SECRET: docker-webhook-secret
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery_app worker --loglevel=info --queues=celery,webhooks,cache --concurrency=2

  # ── Celery Beat (Scheduler) ────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_celery_beat
    environment:
      DATABASE_URL: postgresql://eve_user:eve_password@db:5432/eve_healthcare
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-dev-secret-key
      WEBHOOK_SECRET: docker-webhook-secret
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
